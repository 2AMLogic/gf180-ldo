name: CI

# Runs the self-checks that already exist in this repo:
#   - sim/tests/test_harness.py       (stdlib unittest, no PDK/ngspice needed)
#   - sim/selftest.sh                 (wraps the unit tests + an ngspice/PDK
#                                       PVT smoke run; gracefully SKIPs the
#                                       smoke stage, exit 0, when ngspice/PDK
#                                       are unavailable)
#   - layout/tests/                   (stdlib unittest, no PDK/klayout/xschem
#                                       needed -- covers layout/drclvs.py's
#                                       record-writing path, its --cell
#                                       registry, the LVS negative-control
#                                       contract (a registered control that
#                                       cannot corrupt its own cell's netlist
#                                       must be a hard error, issue #286),
#                                       layout/area_estimate.py, and the
#                                       feedback divider's arrangement --
#                                       but not the DRC/LVS stages themselves)
#   - sim/build_characterization_report.py (regenerated and diffed against
#                                       the committed sim/CHARACTERIZATION.md
#                                       -- fails the build if they diverge,
#                                       enforcing README.md's "regenerate
#                                       after any sim/ record lands" rule; no
#                                       PDK/ngspice needed, see issue #216)
#   - signoff/check.sh                (re-grades this block's T1 state from
#                                       signoff/block-manifest.json via `klt
#                                       signoff --manifest` and fails if a
#                                       pinned content_hash no longer matches
#                                       its artifact or the committed
#                                       signoff/records/t1-tier-report.json no
#                                       longer matches a fresh run -- so the
#                                       verdict of record rots loudly instead
#                                       of silently, see issue #270. Needs klt
#                                       (fetched by uvx) but no PDK/KLayout:
#                                       --manifest mode only reads committed
#                                       JSON envelopes.)
#
# CLAUDE.md's "headless only" flow keeps the default PR path free of any PDK
# or GUI dependency: `harness-selftest` below runs on every push/PR and never
# installs ngspice or the gf180mcu PDK, so it always exercises the unit tests
# and relies on sim/selftest.sh's own env-check to skip (not fail) the PVT
# stage. The PDK-backed run of the *same* self-test lives in the separate
# `pvt-smoke` job, gated to a nightly schedule / manual dispatch / opt-in PR
# label so it never blocks a normal PR. `pvt-smoke` also runs one nominal
# point of `sim/startup` (which, unlike `sim/smoke-bias`, has a `dut_netlist`
# and so instantiates the pass device) -- a standing check, on the apt
# `ngspice` this job installs, that DR-0025's (issue #214) deck-level
# `.options wnflag=1` model-bin pin is still honoured on that build (DR-0027 /
# issue #254 confirms this ngspice-42 build's wnflag facts reproduce).
#
# Explicitly excluded from CI (not "checks", so nothing to wire up):
#   - sim/devchar/**/run.sh, sim/devchar/run_all.sh, sim/devchar/lib/summarize.py
#     regenerate the device-characterization CSVs under sim/devchar/*/results/.
#     They require ngspice + the gf180mcu PDK, take ~15 minutes end to end, and
#     are a data-regeneration workflow (re-run manually when device models
#     change) rather than a pass/fail check — nothing here asserts a result
#     against a threshold, so there is nothing for CI to gate on.
#   - No linter/formatter is configured for this repo yet (package.json's
#     `lint` script is an honest "not configured" placeholder); add a CI job
#     for it if/when one is adopted.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly PDK-backed smoke run — see the pvt-smoke job below.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  harness-selftest:
    name: harness self-test (unit tests, no PDK required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sim/selftest.sh
        run: bash sim/selftest.sh
        # No ngspice/PDK is installed on this runner, so the harness's own
        # `--check-env` gate SKIPs (not fails) the PVT smoke stage; the unit
        # tests (sim/tests/test_harness.py) always run and must pass.

      - name: Run layout/tests (no PDK/klayout/xschem required)
        run: python3 -m unittest discover -s layout/tests -t layout/tests -v

      - name: Verify sim/CHARACTERIZATION.md is up to date
        run: |
          python3 sim/build_characterization_report.py > /tmp/CHARACTERIZATION.md
          if ! diff -u sim/CHARACTERIZATION.md /tmp/CHARACTERIZATION.md; then
            echo "::error::sim/CHARACTERIZATION.md is stale relative to the committed sim/*/records/ and design/netlist/*.spice -- regenerate with 'python3 sim/build_characterization_report.py > sim/CHARACTERIZATION.md' and commit the result (see README.md's rule)."
            exit 1
          fi
        # No PDK/ngspice needed: the generator only reads committed evidence
        # under sim/*/records/, design/netlist/*.spice, and README.md's own
        # spec table, and its own module docstring documents byte-identical
        # output on an unchanged tree.

      - name: Verify decision-record numbers are unique
        run: |
          dupes="$(ls spec/decision-records/DR-*.md \
            | grep -oE 'DR-[0-9]+' | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "::error::two or more spec/decision-records/ files claim the same DR number: $(echo "$dupes" | tr '\n' ' ')-- renumber the one that merged second into the next free slot (issue #268)."
            exit 1
          fi
        # DR numbers are stable cross-referenced identifiers repo-wide, so a
        # duplicate makes every bare "DR-00NN" citation ambiguous. Two sessions
        # each reading "next free number" off origin/main inside the same
        # ten-minute window is enough to collide (PR #263 / PR #264, both
        # DR-0027, 2026-09-19 -- issue #268). This runs on push to main too, so
        # the second merge of a colliding pair fails immediately rather than
        # waiting for a human to notice.

  signoff-tier-report:
    name: T1 tier report (klt signoff --manifest, no PDK required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (fetches the pinned klt revision for signoff/check.sh)
        run: python3 -m pip install --upgrade uv

      - name: Re-grade this block's T1 state
        run: bash signoff/check.sh
        # signoff/records/t1-tier-report.json is the verdict of record that
        # issue #79 (the gap-to-T1 tracker) cites instead of keeping its own
        # hand-maintained checkbox list. It is only worth citing if it cannot
        # rot: this step re-runs `klt signoff --manifest` and fails when a
        # pinned content_hash no longer matches the artifact it covers, or
        # when the committed record no longer matches a fresh run. Both are
        # real news -- either this block's evidence moved or the T1 checklist
        # did (it grew an eleventh item on 2026-09-17, klayout-tools#2025,
        # which invalidated every hand-read that predates it). See
        # signoff/README.md and signoff/check.sh's header, including why the
        # klt revision is pinned there rather than tracking PyPI.
        #
        # No PDK/KLayout/ngspice needed: --manifest mode only reads committed
        # JSON envelopes and the tier doc bundled with klt itself.

  pvt-smoke:
    name: PVT smoke run against gf180mcu (ngspice + PDK)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'ci:pdk-smoke'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice

      - name: Fetch the pinned gf180mcu PDK via volare
        run: |
          python3 -m pip install --upgrade volare
          # Pinned hash from docs/environment-setup.md section 1 — keep this
          # in sync with that doc rather than tracking volare's "latest".
          volare fetch  --pdk gf180mcu c6d73a35f524070e85faff4a6a9eef49553ebc2b
          volare enable --pdk gf180mcu c6d73a35f524070e85faff4a6a9eef49553ebc2b

      - name: Run sim/selftest.sh against the real PDK
        run: |
          export PDK_ROOT="$(volare path)"
          export PDK="gf180mcuD"
          bash sim/selftest.sh --require-pdk

      - name: Smoke a pass-device-bearing corner (model-bin selection, DR-0025/DR-0027)
        run: |
          export PDK_ROOT="$(volare path)"
          export PDK="gf180mcuD"
          # sim/smoke-bias (above) has no dut_netlist, so it never instantiates
          # the pass device and never exercises the '.options wnflag=1' pin
          # DR-0025 (issue #214) added to compose_deck(). This runner's apt
          # `ngspice` is ngspice-42 (Ubuntu 24.04/noble's package as of this
          # writing) -- a different build than the ngspice-46 DR-0025's own
          # evidence was gathered on -- so this step is also the standing
          # portability check DR-0027 (issue #254) confirmed: one nominal
          # point of 'startup' (which does instantiate the pass device via
          # its 'dut_netlist') on a build DR-0025 did not itself cover. A
          # build that stopped honouring the deck-level pin would fail loud
          # here (parse error: "could not find a valid modelname"), never
          # silently.
          # --supply-tol 0 collapses the PVT sweep to a single nominal point
          # (mirrors sim/selftest.sh's own --quick); --no-write means this
          # never mints or touches evidence under sim/startup/records/.
          python3 sim/run_corners.py startup --corners tt --temps 27 --supply-tol 0 --no-write
